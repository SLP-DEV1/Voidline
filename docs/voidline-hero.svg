        <text x="430" y="63" fill="#8d99a4" font-size="12">RUNTIME</text><text x="430" y="88" fill="#f0f4f6" font-size="16">.NET 9 Desktop</text>
        <text x="640" y="63" fill="#8d99a4" font-size="12">DISTRIBUTION</text><text x="640" y="88" fill="#f0f4f6" font-size="16">Binary-only</text>
