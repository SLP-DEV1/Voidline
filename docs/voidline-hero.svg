        <rect x="285" y="87" width="15" height="15" rx="3"/><path d="m288 94 3 3 6-7" fill="none" stroke="#071315" stroke-width="2"/>
        <rect x="285" y="121" width="15" height="15" rx="3"/><path d="m288 128 3 3 6-7" fill="none" stroke="#071315" stroke-width="2"/>
        <rect x="285" y="155" width="15" height="15" rx="3"/><path d="m288 162 3 3 6-7" fill="none" stroke="#071315" stroke-width="2"/>
        <rect x="285" y="189" width="15" height="15" rx="3"/><path d="m288 196 3 3 6-7" fill="none" stroke="#071315" stroke-width="2"/>
