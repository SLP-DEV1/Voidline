<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Voidline promotional interface preview</title>
  <desc id="desc">Dark technical Voidline interface preview for the binary-only Windows and .NET 9 release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071015"/>
      <stop offset="0.55" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#11161d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b22"/>
      <stop offset="1" stop-color="#0e1319"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1dd7d0"/>
      <stop offset="1" stop-color="#45f0dc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#24d8d1" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#24d8d1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#9db3c1" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="760" rx="28" fill="url(#grid)"/>
  <circle cx="1120" cy="160" r="300" fill="url(#glow)"/>
  <circle cx="230" cy="610" r="240" fill="#ef3340" opacity="0.035" filter="url(#soft)"/>

  <g transform="translate(102 64)">
    <path d="M0 3h18l16 27H16zM9 38h18l12 20H21z" fill="url(#accent)"/>
    <text x="55" y="53" fill="#f5f7f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="58" letter-spacing="-2">Voidline</text>
    <text x="57" y="83" fill="#58dcd5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="1.6">BINARY-ONLY WINDOWS / .NET 9 RELEASE</text>
  </g>

