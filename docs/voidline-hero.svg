        <circle r="51" fill="none" stroke="#3c4852"/><circle r="26" fill="none" stroke="#3c4852"/>
        <path d="M-77 0H77M0-77V77" stroke="#3c4852"/>
        <path d="M0-8 8 11H-8z" fill="#26d6cf"/>
        <circle cx="37" cy="-38" r="5" fill="#ef4650"/><circle cx="48" cy="25" r="5" fill="#ef4650"/><circle cx="-35" cy="22" r="4" fill="#ef4650"/>
