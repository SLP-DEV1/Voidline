  <text x="720" y="724" text-anchor="middle" fill="#72808c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1.1">PROMOTIONAL INTERFACE PREVIEW • BINARY DISTRIBUTION</text>
