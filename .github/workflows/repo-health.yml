name: Repository health

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check required repository files
        shell: bash
        run: |
          set -euo pipefail
          required=(README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md RELEASES.md .gitignore Voidline.exe Voidline.dll Voidline.deps.json Voidline.runtimeconfig.json)
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty required file: $file"
              exit 1
            fi
          done

      - name: Validate binary-only positioning
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqi 'Binary-only by design' README.md
          grep -Fqi 'Build from source' README.md
          grep -Fqi 'Release contents' RELEASES.md

      - name: Reject committed local UI state
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch imgui.ini >/dev/null 2>&1; then
            echo "imgui.ini is generated local UI state and must not be committed."
            exit 1
          fi

      - name: Reject unsupported anti-cheat safety claims
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqi 'VAC & VAC Live Secure' README.md || grep -Eiq '(guaranteed[[:space:]-]+undetectable|100%[[:space:]-]+undetectable)' README.md; then
            echo "README contains an unsupported anti-cheat safety claim."
            exit 1
          fi
